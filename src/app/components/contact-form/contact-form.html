<section class="py-5 bg-white">
  <div class="container">
    <div class="row">
      <div class="col-lg-8 mx-auto text-center">
        <h2 class="display-5">SEEKING EXTRAVAGANCE?</h2>
        <p class="lead">Leave your mark of excellence, and expect to hear from us shortly.</p>
      </div>
    </div>
    
    <div class="row mt-4">
      <div class="col-lg-10 mx-auto">
        <form>
          <div class="row g-3">
            <div class="col-md-6">
              <label for="name" class="form-label">Name:</label>
              <input type="text" class="form-control" id="name" placeholder="Your Name" required>
            </div>
            
            <div class="col-md-6">
              <label for="email" class="form-label">Email:</label>
              <input type="email" class="form-control" id="email" placeholder="example@email.com" required>
            </div>
            
            <div class="col-md-6">
              <label for="contact" class="form-label">Contact Number:</label>
              <input type="text" class="form-control" id="contact" placeholder="+60123456789" required>
            </div>
            
            <div class="col-md-6">
              <label for="method" class="form-label">How did you hear about us:</label>
              <select class="form-select" id="method" required>
                <option selected disabled value="">Select here</option>
                <option value="1">Social Media</option>
                <option value="2">Family / Friends</option>
                <option value="3">Email / News</option>
                <option value="4">Events / Exhibitions / Roadshows</option>
                <option value="5">Newspaper / Banner / Bunting</option>
                <option value="6">Hoarding</option>
                <option value="7">Others</option>
              </select>
            </div>
            
            <div class="col-12 d-flex justify-content-center mt-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="consent" required>
                <label class="form-check-label" for="consent">
                  I confirm that I have read and understand your Privacy Policy.
                </label>
              </div>
            </div>
            
            <div class="col-12 text-center mt-4">
              <button type="submit" class="btn btn-dark btn-lg">Register Now</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
